[package]
name = "pineal-heretic"
version = "4.0.0"
description = "Pineal Heretic Tauri Application"
authors = ["Pineal Heretic Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pineal_heretic_core = { path = ".." }
uuid = { version = "1", features = ["v4"] }
