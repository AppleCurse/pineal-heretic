<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINEAL-HERETIC v2.0 - COMMAND CENTER</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- TOP HUD -->
    <header class="hud-panel">
        <div class="telemetry-box" id="tel-core"><span class="led led-off" id="led-core"></span> ÇEKİRDEK MOTOR</div>
        <div class="telemetry-box" id="tel-gw"><span class="led led-off" id="led-gw"></span> LLM AĞ GEÇİDİ</div>
        <div class="telemetry-box" id="tel-scraper"><span class="led led-off" id="led-scraper"></span> KAZIYICI DÜĞÜM</div>
        <div class="telemetry-box" id="tel-vault"><span class="led led-off" id="led-vault"></span> GİZLİ KASA</div>
        <div class="mission-warning" id="mission-warning" style="display: none;">⚠️ OPERASYON SÜRÜYOR</div>
    </header>

    <!-- MAIN GRID -->
    <main class="grid-container">
        
        <!-- LEFT: FLIGHT COMPUTER -->
        <section class="panel panel-left">
            <h2 class="panel-title">01 // UÇUŞ BİLGİSAYARI (PARAMETRELER)</h2>
            <div class="input-group">
                <label>Özel Ritüellerin</label>
                <input type="text" id="inp-rituals" value="çay, kitap, karanlık">
            </div>
            <div class="input-group">
                <label>Gece Playlist</label>
                <input type="text" id="inp-playlist" value="neşet ertaş">
            </div>
            <div class="input-group">
                <label>Gizli İsteklerin</label>
                <input type="text" id="inp-envies" value="anlaşılmak, sadakat">
            </div>

            <h2 class="panel-title" style="margin-top: 30px;">SİSTEM LİMİTLERİ</h2>
            <div class="slider-group">
                <label>Yaratıcılık / Agresiflik (<span id="val-temp">0.7</span>)</label>
                <input type="range" id="inp-temp" min="0" max="1" step="0.1" value="0.7">
            </div>
            <div class="slider-group">
                <label>Kanıt Eşiği (Katılık) (<span id="val-ev">2</span>)</label>
                <input type="range" id="inp-ev" min="1" max="5" step="1" value="2">
            </div>
        </section>

        <!-- CENTER: RADAR & ACTION -->
        <section class="panel panel-center">
            <h2 class="panel-title">02 // TAKTİK RADAR VE ATEŞLEME</h2>
            
            <div class="action-bar">
                <input type="text" id="inp-target-url" placeholder="https://x.com/hedef_kisi" class="target-input">
                <button id="btn-fire" class="fire-btn">🔥 ATEŞLE</button>
            </div>

            <div class="radar-container">
                <div id="radar-logs" class="radar-logs">
                    <!-- Logs injected via JS -->
                </div>
                <div class="radar-footer">▮ <span id="radar-tx"></span></div>
            </div>

            <div id="results-container" class="results-grid">
                <!-- Cards injected via JS -->
            </div>
        </section>

        <!-- RIGHT: VAULT & OVERRIDE -->
        <section class="panel panel-right">
            <h2 class="panel-title">03 // GİZLİ KASA VE HAFIZA</h2>
            
            <div class="vault-box">
                <h3>🔑 GEÇİCİ ANAHTARLIK (VAULT)</h3>
                <div class="input-group">
                    <label>X (Twitter) Cookie</label>
                    <div class="inline-action">
                        <input type="password" id="inp-cookie" placeholder="auth_token=...">
                        <button id="btn-save-cookie" class="mini-btn">ÇEREZİ KİLİTLE</button>
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label>OpenRouter API Anahtarı</label>
                    <div class="inline-action">
                        <input type="password" id="inp-apikey" placeholder="sk-or-v1-...">
                        <button id="btn-save-apikey" class="mini-btn">ANAHTARI ATEŞLE</button>
                    </div>
                </div>
            </div>

            <div class="vault-box" style="margin-top: 20px;">
                <h3>💉 HAFIZAYA MÜDAHALE (OVERRIDE)</h3>
                <div class="input-group">
                    <label>Yıkılamaz Kural / Öğreti</label>
                    <textarea id="inp-fact" rows="3" placeholder="Hedefle asla zayıflık üzerinden konuşma..."></textarea>
                </div>
                <div class="input-group">
                    <label>Etiket</label>
                    <input type="text" id="inp-tag" value="dealbreaker">
                </div>
                <button id="btn-seal" class="seal-btn">BEYNE KAZI (SEAL)</button>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
